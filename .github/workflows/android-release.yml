name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PassVault Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android App (Assemble Debug APK)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/PassVault-Android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build-artifacts/PassVault-Android.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PassVault Android - Release ${{ github.ref_name }}
            
            Compatible con Samsung Galaxy S25 Ultra (Android 15 / One UI 7).
            
            ### Novedades:
            - Cifrado Zero-Knowledge AES-256-GCM + PBKDF2 (600,000 iteraciones).
            - Desbloqueo biométrico nativo (Sensor ultrasónico de huellas en S25 Ultra).
            - Servicio nativo de Autollenado (Autofill Service) para apps y navegadores.
            - Almacenamiento local seguro offline con sincronización automática.
            
            ### Instalación con Obtainium:
            1. Abre Obtainium en tu Galaxy S25 Ultra.
            2. Pulsa en **Añadir App** (`+`).
            3. Pega la URL de este repositorio de GitHub.
            4. Presiona **Añadir** y luego **Instalar**.

      - name: Upload Artifact (Manual Workflow Dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: PassVault-Android-APK
          path: build-artifacts/PassVault-Android.apk

