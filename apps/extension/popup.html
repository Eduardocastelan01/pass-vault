<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PassVault</title>
  <link rel="stylesheet" href="./src/popup.css">
</head>
<body>
  <div id="app">
    <!-- Header General -->
    <header>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>PassVault</span>
      </div>
      <div class="header-actions" id="header-actions" style="display: none;">
        <button class="icon-btn" id="btn-sync" title="Sincronizar ahora">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-lock" title="Bloquear bóveda">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Vista 1: Login / Desbloqueo -->
    <div id="view-auth" class="auth-container">
      <div class="auth-header">
        <h1 id="auth-title">Desbloquear Bóveda</h1>
        <p>Tus contraseñas protegidas con cifrado Zero-Knowledge</p>
      </div>

      <div class="form-group">
        <label>Servidor de Sincronización</label>
        <input type="text" id="auth-server" value="http://localhost:3000">
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="auth-email" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label>Contraseña Maestra</label>
        <input type="password" id="auth-password" placeholder="••••••••••••••••">
      </div>

      <div id="auth-error" style="color: var(--danger); font-size: 11px; display: none;"></div>

      <button class="btn-primary" id="btn-auth-submit">Desbloquear</button>
      <button class="btn-secondary" id="btn-toggle-auth-mode">Crear nueva cuenta</button>
    </div>

    <!-- Vista 2: Bóveda Principal -->
    <div id="view-vault" class="vault-container" style="display: none;">
      <div class="search-box">
        <input type="text" id="vault-search" placeholder="Buscar contraseñas, notas, tarjetas...">
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="all">Todos</div>
        <div class="tab" data-tab="login">Logins</div>
        <div class="tab" data-tab="card">Tarjetas</div>
        <div class="tab" data-tab="note">Notas</div>
      </div>

      <div class="items-list" id="items-list">
        <!-- Renderizado dinámico de tarjetas -->
      </div>

      <div class="bottom-bar">
        <button class="btn-primary" id="btn-open-add" style="flex: 2;">+ Agregar</button>
        <button class="btn-secondary" id="btn-open-generator" style="flex: 1;">Generador</button>
      </div>
    </div>

    <!-- Modal: Agregar Elemento -->
    <div id="modal-add" class="modal" style="display: none;">
      <div class="modal-header">
        <span class="modal-title">Nuevo Elemento</span>
        <button class="icon-btn" id="btn-close-add">✕</button>
      </div>

      <div class="form-group">
        <label>Tipo</label>
        <select id="add-type">
          <option value="login">Inicio de Sesión (Login)</option>
          <option value="card">Tarjeta Bancaria</option>
          <option value="note">Nota Segura</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nombre / Título</label>
        <input type="text" id="add-name" placeholder="Ej: GitHub, Banco, etc.">
      </div>

      <!-- Campos de Login -->
      <div id="fields-login" class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
        <div class="form-group">
          <label>Usuario o Correo</label>
          <input type="text" id="add-username" placeholder="usuario@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <div style="display: flex; gap: 6px;">
            <input type="password" id="add-password" style="flex: 1;">
            <button class="btn-secondary" id="btn-gen-field" type="button" title="Generar">⚡</button>
          </div>
        </div>
        <div class="form-group">
          <label>URL del Sitio</label>
          <input type="text" id="add-uri" placeholder="https://ejemplo.com">
        </div>
      </div>

      <!-- Campos de Tarjeta -->
      <div id="fields-card" style="display: none; flex-direction: column; gap: 8px;">
        <div class="form-group">
          <label>Titular</label>
          <input type="text" id="add-cardholder" placeholder="NOMBRE EN LA TARJETA">
        </div>
        <div class="form-group">
          <label>Número de Tarjeta</label>
          <input type="text" id="add-cardnumber" placeholder="4111 2222 3333 4444">
        </div>
        <div style="display: flex; gap: 8px;">
          <div class="form-group" style="flex: 1;">
            <label>Expiración (MM/AA)</label>
            <input type="text" id="add-cardexp" placeholder="12/28">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>CVV</label>
            <input type="password" id="add-cardcvv" placeholder="123" maxlength="4">
          </div>
        </div>
      </div>

      <!-- Campos de Nota -->
      <div id="fields-note" style="display: none; flex-direction: column; gap: 8px;">
        <div class="form-group">
          <label>Contenido Secreto</label>
          <textarea id="add-notetext" rows="6" placeholder="Escribe tu nota cifrada aquí..."></textarea>
        </div>
      </div>

      <button class="btn-primary" id="btn-save-item">Guardar y Cifrar</button>
    </div>

    <!-- Modal: Generador de Contraseñas -->
    <div id="modal-gen" class="modal" style="display: none;">
      <div class="modal-header">
        <span class="modal-title">Generador de Contraseñas</span>
        <button class="icon-btn" id="btn-close-gen">✕</button>
      </div>

      <div class="form-group">
        <label>Contraseña Generada</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="gen-output" readonly style="font-family: monospace; font-size: 13px;">
          <button class="btn-secondary" id="btn-copy-gen" title="Copiar">📋</button>
        </div>
      </div>

      <div class="strength-meter">
        <span id="gen-score-text">Fuerte</span>
        <div class="meter-bar">
          <div class="meter-fill" id="gen-meter-fill"></div>
        </div>
        <span id="gen-bits">96 bits</span>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between;">
          <label>Longitud</label>
          <span id="gen-len-val">20</span>
        </div>
        <input type="range" id="gen-length" min="8" max="64" value="20">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="gen-upper" checked> Mayúsculas (A-Z)
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="gen-lower" checked> Minúsculas (a-z)
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="gen-num" checked> Números (0-9)
        </label>
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="gen-sym" checked> Símbolos (!@#$%)
        </label>
      </div>

      <button class="btn-secondary" id="btn-gen-passphrase">Generar Frase de Paso (Diceware)</button>
      <button class="btn-primary" id="btn-regenerate">Regenerar</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="display: none;"></div>
  </div>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
